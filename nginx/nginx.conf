server {
  server_tokens off;
  listen 80;

  location /django_static/ {
    alias /static/django_static/;
  }

  location /media/ {
    alias /media/;
  }

  location /api/ {
    proxy_pass http://backend:7000/api/;
    proxy_set_header Host $http_host;
  }

  location /admin/ {
    proxy_pass http://backend:7000/admin/;
    proxy_set_header Host $http_host;
  }

  location / {
    alias /static/;
    try_files $uri $uri/ /index.html;
  }
}